<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Çevrimdışı - Sosyal Yardım Yönetim Sistemi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #003f82, #075b9f 55%, #0f8fb8); padding: 24px; color: #fff;
  }
  .card {
    max-width: 380px; width: 100%; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 28px; text-align: center;
    backdrop-filter: blur(4px);
  }
  img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; margin: 0 0 18px; color: rgba(255,255,255,0.85); }
  button {
    border: 0; border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 800;
    background: #fff; color: #003f82; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>İnternet bağlantısı yok</h1>
    <p>Sosyal Yardım Yönetim Sistemi'ne şu anda ulaşılamıyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
